<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>
    <style>
        /* Modern, smooth UI styling */
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1e1e2f, #111116);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Calculator Wrapper */
        .box {
            width: 360px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 24px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: 100px repeat(4, 70px);
            gap: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
        }

        /* Shared button behavior */
        .sbox {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        /* Hover effects */
        .sbox:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        /* Active click squeeze */
        .sbox:active {
            transform: translateY(1px);
        }

        /* Screen customization */
        #screen {
            grid-column: 1 / 5;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0 20px;
            font-size: 36px;
            font-weight: 300;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
            overflow-x: auto;
            white-space: nowrap;
            cursor: default;
        }
        
        #screen:hover {
            background: rgba(0, 0, 0, 0.2);
            transform: none;
        }

        /* Highlight operator buttons */
        .operator {
            background: rgba(255, 159, 67, 0.15);
            color: #ff9f43;
            border: 1px solid rgba(255, 159, 67, 0.2);
        }
        .operator:hover {
            background: #ff9f43;
            color: #111116;
            box-shadow: 0 0 15px rgba(255, 159, 67, 0.4);
        }

        /* Highlight equals button */
        .equals {
            background: #00ffcc;
            color: #111116;
            font-weight: bold;
        }
        .equals:hover {
            background: #00e6b8;
            color: #111116;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
        }
    </style>
</head>
<body>

    <div class="box">
        <!-- Display screen -->
        <div class="sbox" id="screen">0</div>

        <!-- Row 1 -->
        <div class="sbox" onclick="cal('7')">7</div>
        <div class="sbox" onclick="cal('8')">8</div>
        <div class="sbox" onclick="cal('9')">9</div>
        <div class="sbox operator" onclick="cal('*')">x</div>

        <!-- Row 2 -->
        <div class="sbox" onclick="cal('4')">4</div>
        <div class="sbox" onclick="cal('5')">5</div>
        <div class="sbox" onclick="cal('6')">6</div>
        <div class="sbox operator" onclick="cal('/')">/</div>

        <!-- Row 3 -->
        <div class="sbox" onclick="cal('1')">1</div>
        <div class="sbox" onclick="cal('2')">2</div>
        <div class="sbox" onclick="cal('3')">3</div>
        <div class="sbox operator" onclick="cal('+')">+</div>

        <!-- Row 4 -->
        <div class="sbox" onclick="cal('.')">.</div>
        <div class="sbox" onclick="cal('0')">0</div>
        <div class="sbox equals" onclick="cal('=')">=</div>
        <div class="sbox operator" onclick="cal('-')">-</div>
    </div>

<script>
    let screen = document.getElementById("screen");
    let clearOnNextInput = false;

    function cal(btn) {
        // Clear default initial zero on fresh input
        if (screen.innerText === "0" && btn !== '=') {
            screen.innerText = "";
        }

        if (clearOnNextInput && ['+', '-', '*', '/', '='].indexOf(btn) === -1) {
            screen.innerText = "";
            clearOnNextInput = false;
        }

        switch(btn) {
            case '=':
                try {
                    // Evaluate the mathematical expression string safely
                    let result = eval(screen.innerText);
                    screen.innerText = result;
                    clearOnNextInput = true;
                } catch (error) {
                    screen.innerText = "Error";
                    clearOnNextInput = true;
                }
                break;
            default:
                screen.innerText += btn;
                break;
        }
    }
</script>
</body>
</html>
