<!DOCTYPE html>
<html>

<head>
    <title>Calculator</title>

    <style>
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: black;
        }

        .box {
            width: 320px;
            padding: 20px;
            border: 2px solid white;
            display: grid;
            grid-template-columns: repeat(4, 70px);
            gap: 10px;
        }


        .sbox {
            height: 70px;
            background: gray;
            color:white;
            font-size: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }


        #screen {
            grid-column: 1/5;
            background: greenyellow;
            color: black;
            justify-content: flex-end;
            padding-right: 10px;
        }
    </style>

</head>


<body>


    <div class="box">


        <div class="sbox" id="screen">0</div>
        <div class="sbox" onclick="cal('7')">7</div>
        <div class="sbox" onclick="cal('8')">8</div>
        <div class="sbox" onclick="cal('9')">9</div>
        <div class="sbox" onclick="cal('*')">*</div>
        <div class="sbox" onclick="cal('4')">4</div>
        <div class="sbox" onclick="cal('5')">5</div>
        <div class="sbox" onclick="cal('6')">6</div>
        <div class="sbox" onclick="cal('/')">/</div>
        <div class="sbox" onclick="cal('1')">1</div>
        <div class="sbox" onclick="cal('2')">2</div>
        <div class="sbox" onclick="cal('3')">3</div>
        <div class="sbox" onclick="cal('+')">+</div>
        <div class="sbox" onclick="cal('0')">0</div>
        <div class="sbox" onclick="cal('.')">.</div>
        <div class="sbox" onclick="cal('=')">=</div>
        <div class="sbox" onclick="cal('-')">-</div>
    </div>
    <script>
        let screen = document.getElementById("screen");
        function cal(btn) {
            if (screen.innerText == "0") {
                screen.innerText = "";
            }
            switch (btn) {
                case '1':
                    screen.innerText += "1";
                    break;
                case '2':
                    screen.innerText += "2";
                    break;
                case '3':
                    screen.innerText += "3";
                    break;
                case '4':
                    screen.innerText += "4";
                    break;
                case '5':
                    screen.innerText += "5";
                    break;
                case '6':
                    screen.innerText += "6";
                    break;
                case '7':
                    screen.innerText += "7";
                    break;
                case '8':
                    screen.innerText += "8";
                    break;
                case '9':
                    screen.innerText += "9";
                    break;
                case '0':
                    screen.innerText += "0";
                    break;
                case '+':
                    screen.innerText += "+";
                    break;
                case '-':
                    screen.innerText += "-";
                    break;
                case '*':
                    screen.innerText += "*";
                    break;
                case '/':
                    screen.innerText += "/";
                    break;
                case '.':
                    screen.innerText += ".";
                    break;
                case '=':
                    screen.innerText = eval(screen.innerText);
                    break;
                default:
                    console.log("invalid");
            }

        }
    </script>
</body>
</html>
